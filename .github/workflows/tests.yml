name: EcoLoop artefact checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax checks
        run: |
          node --check app.mjs
          node --check core.mjs
      - name: Core automated tests
        run: node --test tests/core.test.mjs
